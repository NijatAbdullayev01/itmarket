# ITMarket — reverse proxy (live)
#
# NOTE: Public DNS for admin.it-market.org / api.it-market.org must be A→77.42.42.63
# at ns1/ns2.digitalrepublic.az. If those records are missing (NXDOMAIN), browsers
# cannot reach admin even when nginx+PM2 are healthy. Emergency staff host:
# mail.it-market.org (already resolves) proxies to the backoffice until DNS is fixed.
#
# Uploaded `/images/*` stay proxied to Next. Local media uploads dual-write into
# standalone `public/` and PM2-reload the apps (see API LocalFilesystemMediaStorage
# and backoffice reload-storefront-public-assets). Do not add an nginx `root`/`alias`
# under `/root/...` unless www-data can traverse `/root`.

server {
    listen 80;
    listen [::]:80;
    server_name it-market.org www.it-market.org admin.it-market.org api.it-market.org mail.it-market.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.it-market.org;

    ssl_certificate /etc/letsencrypt/live/it-market.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it-market.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://it-market.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name it-market.org;

    ssl_certificate /etc/letsencrypt/live/it-market.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it-market.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


    location = /staff {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        alias /var/www/itmarket-static/staff.html;
    }

    location = /staff/ {
        return 302 /staff;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # mail.it-market.org = emergency admin entry while admin.* DNS is NXDOMAIN
    server_name admin.it-market.org mail.it-market.org;

    ssl_certificate /etc/letsencrypt/live/it-market.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it-market.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.it-market.org;

    ssl_certificate /etc/letsencrypt/live/it-market.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it-market.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }
}
